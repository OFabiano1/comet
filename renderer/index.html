<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>Comet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1 class="logo">Comet</h1>
    <p class="tagline">Cole o link. Escolhe o formato. Chega junto.</p>

    <input id="url" type="text" placeholder="Link do YouTube ou do GIF" autocomplete="off" />

    <div class="actions">
      <button id="btn-mp4" disabled>MP4</button>
      <button id="btn-mp3" disabled>MP3</button>
      <button id="btn-gif" disabled>GIF</button>
      <button id="btn-stop" class="stop" hidden>Parar</button>
    </div>

    <div class="progress-wrap" hidden>
      <progress id="progress" value="0" max="100"></progress>
    </div>

    <p id="status" class="status">Pronto.</p>

    <footer>
      <button id="btn-folder" disabled>Pasta de destino</button>
      <button id="btn-ytdlp-update" disabled>Atualizar yt-dlp</button>
      <p id="versions" class="versions"></p>
    </footer>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
